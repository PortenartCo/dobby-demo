<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Dobby - Test navigateur local</title>
<style>body{font-family:system-ui;margin:25px}#status{font-weight:bold}iframe{width:420px;height:700px;border:1px solid #aaa}</style>
</head><body>
<h1>Dobby V5 - smoke-test</h1>
<div id="status" data-result="RUNNING">RUNNING</div>
<script>
(function(){
  'use strict';
  const sentinel = '{"sentinel":"existing-stitch-data-must-remain"}';
  const oldKey = 'dobby-stitch-preview-20261105';
  localStorage.setItem(oldKey, sentinel);
  const iframe = document.createElement('iframe');
  iframe.id='preview';iframe.src='../index.html';
  document.body.append(iframe);
  let ticks=0, completed=false;
  const timer=setInterval(() => {
    if(completed)return;
    ticks++;
    try {
      const w=iframe.contentWindow, d=iframe.contentDocument;
      if(!d || !w.go || !w.DobbyFamilyUI || !w.DobbyFamilyAgenda || !w.DobbyFamilyMissions || !w.DobbyFamilyFiles || !d.querySelector('#screen')) {
        if(ticks<75)return;
        throw Error('Le chargeur familial n’a pas démarré');
      }
      w.go('shop');
      const panier=d.querySelector('.fv2-panel');
      if(!panier || !panier.textContent.includes('Le panier commun')) {
        throw Error('Le panier partagé n’est pas rendu dans V5');
      }
      if(!d.querySelector('.fv2-recipeprep'))throw Error('La préparation des repas V5 a disparu');
      if(localStorage.getItem(oldKey)!==sentinel)throw Error('Le stockage de l’ancien V5 a été modifié');
      if(!localStorage.getItem('dobby-v5-familial-preview-20261108')) {
        throw Error('La version familiale n’utilise pas son propre stockage');
      }
      const button=d.querySelector('.fv2-panel [data-fv-action="open"]');
      if(!button)throw Error('Le bouton de connexion familiale est absent');
      button.click();
      const dialog=d.getElementById('fv2Overlay');
      if(!dialog || dialog.hidden || !dialog.textContent.includes('Connexion familiale')) {
        throw Error('La connexion familiale ne peut pas être ouverte');
      }
      w.go('family');
      const agenda=d.querySelector('#fpAgenda');
      if(!agenda || !agenda.textContent.includes('Agenda du foyer')) {
        throw Error('L’agenda du foyer n’est pas intégré dans Famille');
      }
      const addEvent=d.querySelector('#fpAgenda [data-fp-action="new"]');
      if(!addEvent)throw Error('Le formulaire familial est inaccessible');
      addEvent.click();
      const editor=d.getElementById('fpDialogLayer');
      if(!editor || editor.hidden || !editor.textContent.includes('membres du foyer')) {
        throw Error('Le formulaire ne prévient pas du caractère partagé des événements');
      }
      const form=d.getElementById('fpEventForm');
      if(!form)throw Error('Le formulaire d’événement n’a pas été créé');
      const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
      const pad=x=>String(x).padStart(2,'0');
      form.querySelector('[name="title"]').value='Sortie de test navigateur';
      form.querySelector('[name="date"]').value=
        tomorrow.getFullYear()+'-'+pad(tomorrow.getMonth()+1)+'-'+pad(tomorrow.getDate());
      form.querySelector('[name="time"]').value='14:30';
      w.__dobbyLastAlert='';
      w.alert=message=>{w.__dobbyLastAlert=String(message);};
      if(!form.checkValidity()) {
        throw Error('Formulaire invalide : '+[...form.elements].filter(x=>x.validity&&!x.validity.valid).map(x=>x.name).join(','));
      }
      form.querySelector('button[type="submit"]').click();
      const recorded=JSON.parse(localStorage.getItem('dobby-v5-familial-preview-20261108')||'{}');
      if(!recorded.familyEvents?.some(x=>x.title==='Sortie de test navigateur')) {
        throw Error('La création d’événement ne persiste pas localement : '+
          (w.__dobbyLastAlert||'aucune alerte')+'; records='+
          (recorded.familyEvents?.length??'absent'));
      }
      if(!d.querySelector('#fpAgenda')?.textContent.includes('Sortie de test navigateur')) {
        throw Error('Le nouvel événement ne figure pas dans l’agenda');
      }
      w.go('home');
      if(!d.querySelector('#screen').textContent.includes('événement Dobby')) {
        throw Error('Le résumé des événements Dobby est absent de l’accueil');
      }
      w.go('missions');
      const missions=d.querySelector('#fmsManual');
      if(!missions || !missions.textContent.includes('À faire ensemble')) {
        throw Error('Le module des missions familiales est absent');
      }
      missions.querySelector('[data-fms-action="new"]').click();
      const missionForm=d.getElementById('fmsForm');
      if(!missionForm)throw Error('Le formulaire de mission est absent');
      missionForm.querySelector('[name="title"]').value='Mission test navigateur';
      missionForm.querySelector('[name="due"]').value=
        tomorrow.getFullYear()+'-'+pad(tomorrow.getMonth()+1)+'-'+pad(tomorrow.getDate());
      missionForm.querySelector('button[type="submit"]').click();
      const saved=JSON.parse(localStorage.getItem('dobby-v5-familial-preview-20261108')||'{}');
      if(!saved.manualMissions?.some(x=>x.title==='Mission test navigateur'&&x.status==='open')) {
        throw Error('Une mission manuelle n’a pas été sauvegardée');
      }
      if(!d.querySelector('#fmsManual')?.textContent.includes('Mission test navigateur')) {
        throw Error('La mission créée n’est pas affichée');
      }
      w.st.familyDocs.push({
        id:'doc-smoke-1',title:'Assurance test',category:'Assurances',provider:'Assureur de test'
      });
      w.go('documents');
      const sharedDocs=d.querySelector('.fds-panel');
      if(!sharedDocs||!sharedDocs.textContent.includes('Documents communs')||
         !sharedDocs.textContent.includes('Assurance test')) {
        throw Error('Les documents du foyer ne sont pas intégrés à V5');
      }
      const view=d.querySelector('.fds-list [data-doc="view"][data-id="doc-smoke-1"]');
      if(!view)throw Error('Le dossier partagé ne peut pas être ouvert');
      view.click();
      const details=[...d.querySelectorAll('.fds-panel')].find(x=>
        x.textContent.includes('Partage avec le foyer'));
      if(!details || !details.querySelector('[data-fds-file="doc-smoke-1"]')){
        throw Error('L’envoi volontaire du fichier familial est inaccessible');
      }
      if(!details.querySelector('[data-fds-file="doc-smoke-1"]').disabled){
        throw Error('Un upload Cloud ne doit pas être autorisé avant la connexion Supabase');
      }
      completed=true;clearInterval(timer);
      const s=document.getElementById('status');
      s.dataset.result='PASS';s.textContent='PASS - courses, agenda, missions, documents volontaires et stockage isolé';
    }catch(e){
      if(e.message === 'Le chargeur familial n’a pas démarré' && ticks<75)return;
      completed=true;clearInterval(timer);
      const s=document.getElementById('status');
      s.dataset.result='FAIL';s.textContent='FAIL - '+e.message;
    }
  },200);
})();
</script></body></html>
