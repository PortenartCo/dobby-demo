<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DOBBY V7</title><link rel="canonical" href="https://portenartco.github.io/dobby-demo/"><script>
'use strict';
// The public URL always enters native access. Only Auth/invitation inputs may
// survive forwarding; a legacy route hash must not bypass account verification.
const input=new URL(location.href);
const destination=new URL('./essai-stitch-v7/famille.html#access',input);
const fields=['invite','invitation','code','dobby_flow','token','token_hash','access_token','refresh_token','expires_in','expires_at','token_type','type','error','error_description','error_code'];
for(const name of fields)for(const value of input.searchParams.getAll(name))destination.searchParams.append(name,value);
const fragment=input.hash.slice(1),separator=fragment.indexOf('?');
const fragmentFields=new URLSearchParams(separator<0?fragment:fragment.slice(separator+1));
if(['access_token','refresh_token','error','error_description','error_code'].some(name=>fragmentFields.has(name))){
  const callbackFragment=new URLSearchParams();
  for(const name of fields)for(const value of fragmentFields.getAll(name))callbackFragment.append(name,value);
  destination.hash=callbackFragment.toString();
}else{
  for(const name of ['invite','invitation','code','dobby_flow'])if(!destination.searchParams.has(name))for(const value of fragmentFields.getAll(name))destination.searchParams.append(name,value);
}
// The first native head script consumes and removes these private inputs before
// other scripts, styles or images load. No destination comes from URL input.
location.replace(destination.href);
</script></head><body><p>Ouverture de DOBBY V7…</p><p><a href="./essai-stitch-v7/famille.html#access">Entrer dans DOBBY</a></p><noscript>Activez JavaScript pour utiliser les formulaires et la synchronisation de DOBBY.</noscript></body></html>
