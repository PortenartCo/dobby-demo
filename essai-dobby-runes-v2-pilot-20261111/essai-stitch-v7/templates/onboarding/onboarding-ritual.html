    @keyframes cinematicBreathe {

      100% { transform: scale(1.005) translate(0px, 0px); }

      animation: cinematicBreathe 14s ease-in-out infinite;
      will-change: transform;
    }

    }
    .btn-magic-glow {
      animation: buttonMagicHalo 3.5s ease-in-out infinite;
    }
