name: DOBBY Runes lot 2
on:
  pull_request:
    paths:
      - 'docs/dobby-v7/runes-lot2/**'
      - 'essai-stitch-v5-famille/family-mission-progress.mjs'
      - 'essai-stitch-v7/tests/runes-lot2-ui.cjs'
      - '.github/workflows/dobby-runes-lot2.yml'
permissions:
  contents: read
jobs:
  runes-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Missions, family, sync and exact source provenance
        run: node --test essai-stitch-v5-famille/tests/*.test.mjs essai-sync-v1/tests/*.test.mjs essai-sync-v2/tests/*.test.mjs essai-stitch-v7/tests/fam-integration-transverse.test.cjs
      - name: Apply Lot 1 and Lot 2 to a fictional PostgreSQL database
        run: |
          git fetch --no-tags --depth=1 origin 04c58d9ebaf84374820a5e6a727c45dfa4ee3527
          python3 docs/dobby-v7/runes-lot2/test-postgres.py
      - run: npm ci --ignore-scripts --prefix essai-stitch-v7/tests
      - name: V7 individual participation and rewards at 320, 390 and 1440 px
        env:
          DOBBY_TEST_ORIGIN: http://127.0.0.1:8772
          DOBBY_RUNES_LOT2_EVIDENCE: ${{ runner.temp }}/dobby-lot2
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8772 --bind 127.0.0.1 > "$RUNNER_TEMP/dobby-lot2-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node -e "(async()=>{for(let i=0;i<50;i++){try{if((await fetch(process.env.DOBBY_TEST_ORIGIN)).ok)return}catch{}await new Promise(r=>setTimeout(r,100))}process.exit(1)})()"
          node essai-stitch-v7/tests/runes-lot2-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dobby-runes-lot2-parcours
          path: ${{ runner.temp }}/dobby-lot2/
