name: DOBBY Catalogue lot 3
on:
  pull_request:
    paths:
      - 'docs/dobby-v7/catalogue-lot3/**'
      - 'essai-stitch-v7/build-recipe-catalogue.mjs'
      - 'essai-stitch-v7/tests/catalogue-lot3*'
      - 'essai-stitch-v5-famille/catalogue/**'
      - '.github/workflows/dobby-catalogue-lot3.yml'
permissions:
  contents: read
jobs:
  catalogue-and-shared-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DOBBY_TEST_ORIGIN: http://127.0.0.1:8773
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalogue intake, transport and exact source provenance
        env:
          DOBBY_CATALOGUE_FIXTURE: ${{ runner.temp }}/dobby-catalogue-fixture
        run: |
          node --test essai-stitch-v7/tests/{catalogue-lot3.test.mjs,e07-3-import-format.test.mjs,e07-4-import-format.test.mjs,fam-integration-transverse.test.cjs}
      - name: Shared media in a fictional PostgreSQL instance
        run: |
          git fetch --no-tags --depth=1 origin 04c58d9ebaf84374820a5e6a727c45dfa4ee3527
          python3 -u docs/dobby-v7/catalogue-lot3/test-postgres.py
      - run: npm ci --ignore-scripts --prefix essai-stitch-v7/tests
      - name: ZIP, native CAS, independent profiles, reload, planning and cook views
        env:
          DOBBY_CATALOGUE_FIXTURE: ${{ runner.temp }}/dobby-catalogue-fixture
          DOBBY_CATALOGUE_EVIDENCE: ${{ runner.temp }}/dobby-catalogue-evidence
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8773 --bind 127.0.0.1 > "$RUNNER_TEMP/dobby-lot3-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node -e "(async()=>{for(let i=0;i<50;i++){try{if((await fetch(process.env.DOBBY_TEST_ORIGIN)).ok)return}catch{}await new Promise(r=>setTimeout(r,100))}process.exit(1)})()"
          node essai-stitch-v7/tests/catalogue-lot3-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dobby-catalogue-lot3-parcours
          path: ${{ runner.temp }}/dobby-catalogue-evidence/
