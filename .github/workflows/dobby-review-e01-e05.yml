name: DOBBY review E01-E05 (isolated)
on:
  push:
    branches: ['feat/dobby-review-e01-e05-20261111']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical offline, identity, missions and sync tests
        run: node --test essai-sync-v1/tests/*.test.mjs essai-sync-v2/tests/*.test.mjs essai-stitch-v5-famille/tests/*.test.mjs
      - name: Browser dependencies
        working-directory: essai-stitch-v7/tests
        run: npm ci --ignore-scripts
      - name: Independent review campaign without deployment
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dobby-review-http.log 2>&1 &
          if command -v google-chrome >/dev/null; then
            BROWSER="$(command -v google-chrome)"
          else
            BROWSER="$(command -v chromium)"
          fi
          CHROMIUM_PATH="$BROWSER" node essai-stitch-v7/tests/review-e01-e05-campaign.cjs
      - name: Review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobby-review-e01-e05-evidence
          path: docs/dobby-v7/evidence/review-e01-e05/
          retention-days: 14
