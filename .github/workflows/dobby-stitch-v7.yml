name: Dobby V7 - Stitch functional UI
on:
  push:
    paths:
      - 'essai-stitch-v7/**'
      - 'design/stitch-53/**'
      - 'design/stitch-e07/**'
      - 'scripts/build-dobby-review.cjs'
      - 'scripts/review/**'
      - 'docs/dobby-v7/**'
      - '.github/workflows/dobby-stitch-v7.yml'
  pull_request:
    paths:
      - 'essai-stitch-v7/**'
      - 'design/stitch-53/**'
      - 'design/stitch-e07/**'
      - 'scripts/build-dobby-review.cjs'
      - 'scripts/review/**'
      - 'docs/dobby-v7/**'
      - '.github/workflows/dobby-stitch-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-backed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaustive review registry coverage
        run: node scripts/check-review-consolidation.cjs --final
      - name: Check V7 JavaScript syntax
        run: |
          node --check essai-stitch-v7/build-source.cjs
          node --check essai-stitch-v7/bridge.js
          node --check essai-stitch-v7/chrome.js
          node --check essai-stitch-v7/home.js
          node --check essai-stitch-v7/engine-policy.js
          node --check essai-stitch-v7/chat.js
          node --check essai-stitch-v7/chat-engine.js
          node --check essai-stitch-v7/tests/e02.cjs
          node --check essai-stitch-v7/tests/e02-edge.cjs
          node --check essai-stitch-v7/tests/e02-publish.cjs
          node --check essai-stitch-v7/tests/e02-voice-history.cjs
          node --check essai-stitch-v7/tests/e01.cjs
          node --check essai-stitch-v7/tests/e01-3.cjs
          node --check essai-stitch-v7/tests/e01-3-video.cjs
          node --check essai-stitch-v7/tests/e01-visual.cjs
          node --check essai-stitch-v7/root-adapters.js
          node --check essai-stitch-v7/tests/smoke.cjs
          node --check essai-stitch-v7/build-cuisine.cjs
          node --check essai-stitch-v7/cuisine-engine.js
          node --check essai-stitch-v7/cuisine.js
          node --check essai-stitch-v7/cuisine-e07.js
          node --check essai-stitch-v7/cuisine-list.js
          node --check essai-stitch-v5-famille/family-v2.js
          node --check scripts/build-dobby-review.cjs
          node --check scripts/review/review-runtime.js
          node --check scripts/review/integrated-config.js
          node --check essai-stitch-v7/tests/integrated-preview.cjs
          node --check essai-stitch-v7/tests/e07-2-boot.cjs
          node --check essai-stitch-v7/tests/e07-2.cjs
          node --check essai-stitch-v7/tests/e07-2-model.cjs
          node --check essai-stitch-v7/tests/e07-2-preview.cjs
          node --check essai-stitch-v7/tests/e07.cjs
          node --check essai-stitch-v7/tests/e07-native-actions.cjs
          node --check essai-stitch-v7/tests/e07-1.cjs
          node --check essai-stitch-v7/tests/e07-1-context.cjs
          node --check essai-stitch-v7/tests/cuisine.cjs
          node --check essai-stitch-v7/tests/cuisine-visual.cjs
          node --check essai-stitch-v7/tests/cuisine-family.cjs
          node --check essai-stitch-v7/build-family.cjs
          node --check essai-stitch-v7/family-engine.js
          node --check essai-stitch-v7/member-avatar.js
          node --check essai-stitch-v7/tests/e04.cjs
          node --check essai-stitch-v7/tests/e04-runes.cjs
          node --check essai-stitch-v7/tests/runes-native.cjs
          node --check essai-stitch-v7/tests/e04-runes-capture.cjs
          node --check essai-stitch-v7/import-runtime.js
          node --check essai-stitch-v7/family.js
          node --check essai-stitch-v7/tests/family.cjs
          node --check essai-stitch-v7/tests/family-edge.cjs
          node --check essai-stitch-v7/tests/family-review.cjs
          node --check essai-stitch-v7/tests/family-shared.cjs
          node --check essai-stitch-v7/tests/family-visual.cjs
          for file in essai-stitch-v7/register*.js essai-stitch-v7/*-register.js essai-stitch-v7/build-register.cjs essai-stitch-v7/tests/register-*.cjs essai-stitch-v7/tests/ci.cjs; do node --check "$file"; done
      - name: Existing offline, family and conflict regressions
        run: node --test essai-sync-v1/tests/*.test.mjs essai-sync-v2/tests/*.test.mjs essai-stitch-v5-famille/tests/*.test.mjs
      - name: Integrated preview builder and byte provenance
        run: node --test essai-stitch-v7/tests/integrated-build.test.cjs
      - name: E06 exhaustive scoring, identity and draft isolation
        run: node --test essai-stitch-v7/tests/e06-*.test.mjs
      - name: Source derivation remains reproducible
        run: |
          npm ci --ignore-scripts --prefix essai-stitch-v7
          node essai-stitch-v7/build-source.cjs
          npm run build:css --prefix essai-stitch-v7
          git diff --exit-code -- essai-stitch-v7/stitch-tailwind.css essai-stitch-v7/assets/cuisine/e07-taverne.png essai-stitch-v7/assets/cuisine/e07-courses.png essai-stitch-v7/templates essai-stitch-v7/chrome-source.html essai-stitch-v7/register-route-data.js essai-stitch-v7/route-manifest.json essai-stitch-v7/index.html essai-stitch-v7/traverse.html essai-stitch-v7/missions.html essai-stitch-v7/famille.html
      - name: Confirm the original Stitch source manifest
        run: |
          node -e "const m=require('./design/stitch-53/manifest.json');if(m.html_pages!==53 || m.designs.length!==53)process.exit(1);"
      - name: Browser tooling (tests only)
        working-directory: essai-stitch-v7/tests
        run: npm ci --ignore-scripts
      - name: Functional Stitch roots and source fidelity
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dobby-v7-http.log 2>&1 &
          sleep 1
          if command -v google-chrome >/dev/null; then
            BROWSER="$(command -v google-chrome)"
          elif command -v chromium >/dev/null; then
            BROWSER="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null; then
            BROWSER="$(command -v chromium-browser)"
          else
            echo "No Chrome/Chromium available on runner"
            exit 1
          fi
          CHROMIUM_PATH="$BROWSER" node essai-stitch-v7/tests/ci.cjs
      - name: Keep root, Cuisine and Family comparisons (320/390px)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobby-v7-stitch-visual-evidence
          path: docs/dobby-v7/evidence/
          retention-days: 14
