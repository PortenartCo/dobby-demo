name: Dobby Sync regression (local)
on:
  push:
    paths:
      - 'essai-sync-v1/**'
      - 'essai-sync-v2/**'
      - 'essai-stitch-v5-famille/**'
      - 'sql-proposals/dobby-v2-modules.sql'
      - 'sql-proposals/dobby-family-files.sql'
      - '.github/workflows/dobby-sync-regression.yml'
  pull_request:
    paths:
      - 'essai-sync-v1/**'
      - 'essai-sync-v2/**'
      - 'essai-stitch-v5-famille/**'
      - 'sql-proposals/dobby-v2-modules.sql'
      - 'sql-proposals/dobby-family-files.sql'
      - '.github/workflows/dobby-sync-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax (both pilots)
        run: |
          node --check essai-sync-v1/app.js
          node --check essai-sync-v1/core.mjs
          node --check essai-sync-v1/sw.js
          node --check essai-sync-v2/app.js
          node --check essai-sync-v2/core.mjs
          node --check essai-sync-v2/sw.js
          node --check essai-stitch-v5-famille/stitch-v5.js
          node --check essai-stitch-v5-famille/family-v2.js
          node --check essai-stitch-v5-famille/family-modules.js
          node --check essai-stitch-v5-famille/family-agenda.js
          node --check essai-stitch-v5-famille/family-agenda-core.mjs
          node --check essai-stitch-v5-famille/family-missions.js
          node --check essai-stitch-v5-famille/family-missions-core.mjs
          node --check essai-stitch-v5-famille/family-files.js
          node --check essai-stitch-v5-famille/family-core.mjs
      - name: Deterministic offline/conflict regression
        run: |
          node --test essai-sync-v1/tests/*.test.mjs
          node --test essai-sync-v2/tests/*.test.mjs
          node --test essai-stitch-v5-famille/tests/*.test.mjs
      - name: Check isolated Stitch V5 source and storage
        run: node --test essai-stitch-v5-famille/tests/integration.test.mjs
      - name: Chromium browser smoke (Stitch V5 shell)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dobby-http.log 2>&1 &
          sleep 1
          if command -v google-chrome >/dev/null; then
            BROWSER="$(command -v google-chrome)"
          elif command -v chromium >/dev/null; then
            BROWSER="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null; then
            BROWSER="$(command -v chromium-browser)"
          else
            echo "No Chromium browser installed on runner"
            exit 1
          fi
          "$BROWSER" --no-sandbox --headless=new --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=16000 --dump-dom http://127.0.0.1:8765/essai-stitch-v5-famille/tests/browser-smoke.html > /tmp/dobby-dom.html 2>/tmp/dobby-chrome.log
          if ! grep -q 'data-result="PASS"' /tmp/dobby-dom.html; then
            echo 'BROWSER_SMOKE_FAILED'
            grep -E 'data-result|RUNNING|FAIL' /tmp/dobby-dom.html | tail -n 8 || true
            tail -n 40 /tmp/dobby-chrome.log || true
            exit 1
          fi
          echo 'BROWSER_SMOKE_PASS'
