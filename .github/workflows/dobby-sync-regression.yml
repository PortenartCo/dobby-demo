name: Dobby Sync regression (local)
on:
  push:
    paths:
      - 'essai-sync-v1/**'
      - 'essai-sync-v2/**'
      - 'essai-stitch-v5-famille/**'
      - 'sql-proposals/dobby-v2-modules.sql'
      - '.github/workflows/dobby-sync-regression.yml'
  pull_request:
    paths:
      - 'essai-sync-v1/**'
      - 'essai-sync-v2/**'
      - 'essai-stitch-v5-famille/**'
      - 'sql-proposals/dobby-v2-modules.sql'
      - '.github/workflows/dobby-sync-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax (both pilots)
        run: |
          node --check essai-sync-v1/app.js
          node --check essai-sync-v1/core.mjs
          node --check essai-sync-v1/sw.js
          node --check essai-sync-v2/app.js
          node --check essai-sync-v2/core.mjs
          node --check essai-sync-v2/sw.js
          node --check essai-stitch-v5-famille/stitch-v5.js
          node --check essai-stitch-v5-famille/family-v2.js
          node --check essai-stitch-v5-famille/family-modules.js
          node --check essai-stitch-v5-famille/family-core.mjs
      - name: Deterministic offline/conflict regression
        run: |
          node --test essai-sync-v1/tests/*.test.mjs
          node --test essai-sync-v2/tests/*.test.mjs
          node --test essai-stitch-v5-famille/tests/*.test.mjs
      - name: Confirm original Stitch V5 HTML is unchanged
        run: cmp essai-stitch-v5/index.html essai-stitch-v5-famille/index.html
