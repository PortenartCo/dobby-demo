name: DOBBY Avec mes ingrédients lot 4
on:
  pull_request:
    paths:
      - 'docs/dobby-v7/ingredients-lot4/**'
      - 'essai-stitch-v7/ingredient-matching.mjs'
      - 'essai-stitch-v7/cuisine-ingredients.mjs'
      - 'essai-stitch-v7/tests/ingredient-matching*'
      - '.github/workflows/dobby-ingredients-lot4.yml'
permissions:
  contents: read
jobs:
  native-ingredient-search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify the exact pull request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the local WebP encoder
        run: |
          if ! command -v convert >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends imagemagick
          fi
      - name: Structured matching, existing native modules and source provenance
        env:
          DOBBY_CATALOGUE_FIXTURE: ${{ runner.temp }}/dobby-ingredients-catalogue-fixture
        run: node --test essai-stitch-v5-famille/tests/*.test.mjs essai-stitch-v7/tests/*.test.mjs essai-stitch-v7/tests/fam-integration-transverse.test.cjs
      - name: Local PostgreSQL contracts for Runes and recipe images
        run: |
          git fetch --no-tags --depth=1 origin 04c58d9ebaf84374820a5e6a727c45dfa4ee3527
          python3 -u docs/dobby-v7/runes-lot2/test-postgres.py
          python3 -u docs/dobby-v7/catalogue-lot3/test-postgres.py
      - run: npm ci --ignore-scripts --prefix essai-stitch-v7/tests
      - name: Cuisine, import, step images, Runes and ingredient search in three viewports
        env:
          DOBBY_TEST_ORIGIN: http://127.0.0.1:8774
          DOBBY_CATALOGUE_FIXTURE: ${{ runner.temp }}/dobby-ingredients-catalogue-fixture
          DOBBY_INGREDIENTS_EVIDENCE: ${{ runner.temp }}/dobby-ingredients-parcours
          DOBBY_E073_IMPORT_EVIDENCE: ${{ runner.temp }}/dobby-ingredients-parcours/import-e073
          DOBBY_CATALOGUE_EVIDENCE: ${{ runner.temp }}/dobby-ingredients-parcours/catalogue
          DOBBY_RUNES_LOT2_EVIDENCE: ${{ runner.temp }}/dobby-ingredients-parcours/runes
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8774 --bind 127.0.0.1 > "$RUNNER_TEMP/dobby-lot4-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node -e "(async()=>{for(let i=0;i<50;i++){try{if((await fetch(process.env.DOBBY_TEST_ORIGIN)).ok)return}catch{}await new Promise(r=>setTimeout(r,100))}process.exit(1)})()"
          node essai-stitch-v7/tests/ingredient-matching-ui.cjs
          node essai-stitch-v7/tests/e07-3-import.cjs
          node essai-stitch-v7/tests/catalogue-lot3-ui.cjs
          node essai-stitch-v7/tests/catalogue-lot3-steps-ui.cjs
          node essai-stitch-v7/tests/runes-lot2-ui.cjs
          test_path="$GITHUB_WORKSPACE/essai-stitch-v7/tests/e07-4-c-ui.cjs"
          cd "$RUNNER_TEMP"
          node "$test_path"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dobby-ingredients-lot4-parcours
          path: ${{ runner.temp }}/dobby-ingredients-parcours/
